<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Nvidia Drivers — vaporwave">
  <title>Nvidia Drivers — Arch Linux</title>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0"    stop-color="#05010f"/>
      <stop offset=".45"  stop-color="#1b0640"/>
      <stop offset=".72"  stop-color="#5b1a79"/>
      <stop offset=".92"  stop-color="#c33ba5"/>
      <stop offset="1"    stop-color="#ff5e8a"/>
    </linearGradient>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="106" x2="0" y2="240">
      <stop offset="0"   stop-color="#ffd319"/>
      <stop offset=".45" stop-color="#ff901f"/>
      <stop offset=".75" stop-color="#ff2975"/>
      <stop offset="1"   stop-color="#f222ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0"  stop-color="#ff71ce" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#ff71ce" stop-opacity=".18"/>
      <stop offset="1"  stop-color="#ff71ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horiz" gradientUnits="userSpaceOnUse" x1="0" y1="162" x2="0" y2="176">
      <stop offset="0"  stop-color="#01cdfe" stop-opacity="0"/>
      <stop offset=".5" stop-color="#01cdfe" stop-opacity=".65"/>
      <stop offset="1"  stop-color="#01cdfe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="240">
      <stop offset="0" stop-color="#05010f" stop-opacity="0"/>
      <stop offset="1" stop-color="#05010f" stop-opacity=".85"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="500" cy="178" r="72"/></clipPath>
    <clipPath id="ground"><rect x="0" y="170" width="1000" height="70"/></clipPath>
  </defs>

  <style>
    @keyframes gridmove { from { transform: scale(1); } to { transform: scale(1.25); } }
    .rings { transform-origin: 500px 170px; animation: gridmove 2.6s linear infinite; }
    @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.9; } }
    .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
    .palmL { transform-origin: 95px 242px;  animation: sway 5s   ease-in-out infinite alternate; }
    .palmR { transform-origin: 905px 242px; animation: sway 6.2s ease-in-out infinite alternate; }
    @keyframes flicker {
      0%,90%,100% { opacity:1; } 92% { opacity:.55; } 93% { opacity:1; }
      96% { opacity:.7; } 97% { opacity:1; }
    }
    .neon { animation: flicker 7s linear infinite; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
    .sun { transform-origin: 500px 178px; animation: pulse 5s ease-in-out infinite alternate; }
  </style>

  <rect width="1000" height="240" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#e8d9ff">
    <circle class="star" cx="60"  cy="30" r="1.6" style="animation-delay:.2s"/>
    <circle class="star" cx="140" cy="58" r="1.2" style="animation-delay:1.1s"/>
    <circle class="star" cx="220" cy="24" r="1.5" style="animation-delay:2.2s"/>
    <circle class="star" cx="310" cy="70" r="1.1" style="animation-delay:.7s"/>
    <circle class="star" cx="360" cy="18" r="1.4" style="animation-delay:1.8s"/>
    <circle class="star" cx="645" cy="42" r="1.2" style="animation-delay:2.6s"/>
    <circle class="star" cx="700" cy="26" r="1.5" style="animation-delay:.5s"/>
    <circle class="star" cx="790" cy="62" r="1.1" style="animation-delay:1.5s"/>
    <circle class="star" cx="880" cy="34" r="1.6" style="animation-delay:2.9s"/>
    <circle class="star" cx="945" cy="76" r="1.2" style="animation-delay:1s"/>
  </g>

  <!-- brilho + sol -->
  <circle cx="500" cy="178" r="130" fill="url(#glow)"/>
  <g class="sun">
    <circle cx="500" cy="178" r="72" fill="url(#sun)"/>
    <g clip-path="url(#sunclip)" fill="url(#sky)">
      <rect x="400" y="182" width="200" height="2.5"/>
      <rect x="400" y="189" width="200" height="3.5"/>
      <rect x="400" y="198" width="200" height="4.5"/>
      <rect x="400" y="209" width="200" height="6"/>
      <rect x="400" y="222" width="200" height="9"/>
    </g>
  </g>

  <!-- horizonte -->
  <rect x="0" y="162" width="1000" height="14" fill="url(#horiz)"/>
  <rect x="0" y="169.4" width="1000" height="1.6" fill="#01cdfe" opacity=".9"/>

  <!-- grid em perspectiva -->
  <g clip-path="url(#ground)">
    <g class="rings">
      <g stroke="#01cdfe" stroke-width="1.2" opacity=".5">
        <line x1="500" y1="170" x2="-540" y2="320"/>
        <line x1="500" y1="170" x2="-410" y2="320"/>
        <line x1="500" y1="170" x2="-280" y2="320"/>
        <line x1="500" y1="170" x2="-150" y2="320"/>
        <line x1="500" y1="170" x2="-20"  y2="320"/>
        <line x1="500" y1="170" x2="110"  y2="320"/>
        <line x1="500" y1="170" x2="240"  y2="320"/>
        <line x1="500" y1="170" x2="370"  y2="320"/>
        <line x1="500" y1="170" x2="500"  y2="320"/>
        <line x1="500" y1="170" x2="630"  y2="320"/>
        <line x1="500" y1="170" x2="760"  y2="320"/>
        <line x1="500" y1="170" x2="890"  y2="320"/>
        <line x1="500" y1="170" x2="1020" y2="320"/>
        <line x1="500" y1="170" x2="1150" y2="320"/>
        <line x1="500" y1="170" x2="1280" y2="320"/>
        <line x1="500" y1="170" x2="1410" y2="320"/>
        <line x1="500" y1="170" x2="1540" y2="320"/>
      </g>
      <g stroke="#01cdfe" stroke-width="1.4">
        <line x1="-400" y1="173.3" x2="1400" y2="173.3" opacity=".15"/>
        <line x1="-400" y1="175.2" x2="1400" y2="175.2" opacity=".22"/>
        <line x1="-400" y1="176.5" x2="1400" y2="176.5" opacity=".3"/>
        <line x1="-400" y1="178.1" x2="1400" y2="178.1" opacity=".36"/>
        <line x1="-400" y1="180.2" x2="1400" y2="180.2" opacity=".42"/>
        <line x1="-400" y1="182.7" x2="1400" y2="182.7" opacity=".48"/>
        <line x1="-400" y1="185.9" x2="1400" y2="185.9" opacity=".55"/>
        <line x1="-400" y1="189.9" x2="1400" y2="189.9" opacity=".62"/>
        <line x1="-400" y1="194.9" x2="1400" y2="194.9" opacity=".68"/>
        <line x1="-400" y1="201.1" x2="1400" y2="201.1" opacity=".75"/>
        <line x1="-400" y1="208.8" x2="1400" y2="208.8" opacity=".8"/>
        <line x1="-400" y1="218.6" x2="1400" y2="218.6" opacity=".85"/>
        <line x1="-400" y1="230.7" x2="1400" y2="230.7" opacity=".9"/>
        <line x1="-400" y1="245.9" x2="1400" y2="245.9" opacity=".92"/>
        <line x1="-400" y1="264.9" x2="1400" y2="264.9" opacity=".94"/>
        <line x1="-400" y1="288.6" x2="1400" y2="288.6" opacity=".95"/>
        <line x1="-400" y1="318.3" x2="1400" y2="318.3" opacity=".95"/>
        <line x1="-400" y1="355.4" x2="1400" y2="355.4" opacity=".95"/>
      </g>
    </g>
  </g>

  <!-- palmeiras -->
  <g class="palmL" stroke="#0a0118" fill="none" stroke-linecap="round">
    <path d="M95,244 C100,212 108,190 125,168" stroke-width="7"/>
    <path d="M125,168 Q152,148 184,156" stroke-width="5.5"/>
    <path d="M125,168 Q158,170 180,190" stroke-width="5.5"/>
    <path d="M125,168 Q146,138 172,126" stroke-width="5.5"/>
    <path d="M125,168 Q104,136 76,128"  stroke-width="5.5"/>
    <path d="M125,168 Q94,150 60,146"   stroke-width="5.5"/>
    <path d="M125,168 Q86,172 58,192"   stroke-width="5.5"/>
  </g>
  <g class="palmR" stroke="#0a0118" fill="none" stroke-linecap="round">
    <path d="M905,244 C900,212 892,190 875,168" stroke-width="7"/>
    <path d="M875,168 Q848,148 816,156" stroke-width="5.5"/>
    <path d="M875,168 Q842,170 820,190" stroke-width="5.5"/>
    <path d="M875,168 Q854,138 828,126" stroke-width="5.5"/>
    <path d="M875,168 Q896,136 924,128" stroke-width="5.5"/>
    <path d="M875,168 Q906,150 940,146" stroke-width="5.5"/>
    <path d="M875,168 Q914,172 942,192" stroke-width="5.5"/>
  </g>

  <rect x="0" y="200" width="1000" height="40" fill="url(#vignette)"/>

  <!-- título -->
  <g class="neon" font-family="'Courier New', Courier, monospace" font-weight="bold" text-anchor="middle">
    <text x="497" y="58" font-size="40" letter-spacing="12" fill="#ff2a6d" opacity=".8">NVIDIA DRIVERS</text>
    <text x="503" y="58" font-size="40" letter-spacing="12" fill="#01cdfe" opacity=".8">NVIDIA DRIVERS</text>
    <text x="500" y="58" font-size="40" letter-spacing="12" fill="#ffffff">NVIDIA DRIVERS</text>
  </g>
  <text x="500" y="92" font-size="14" letter-spacing="9" fill="#9bf3ff" text-anchor="middle" font-family="'Courier New', Courier, monospace">I N S T A L A D O R  ·  A R C H  ·  L I N U X</text>
</svg>
